services:
  # 1. FastAPI API server service
  api:
    image: backend-api:latest
    build:
      context: . # Use the Dockerfile in the project root
      args:
        # Default 0 = CPU-only PyTorch. Set USE_CUDA=1 for CUDA-enabled wheels.
        USE_CUDA: ${USE_CUDA:-0}
    container_name: ngpsuite-api
    expose:
      - "5000"
    # Basic-auth credentials for /api/predict (set in backend/.env; empty = placeholder
    # your_username / your_password). NGPSUITE_BIND is only used to pick the startup warning text;
    # the published address is set on the nginx service below.
    environment:
      NGPSUITE_USERNAME: ${NGPSUITE_USERNAME:-}
      NGPSUITE_PASSWORD: ${NGPSUITE_PASSWORD:-}
      NGPSUITE_BIND: ${NGPSUITE_BIND:-127.0.0.1}
    # GMDB models, gallery encodings and metadata are not part of the image.
    # They are mounted read-only from $NGPSUITE_GMDB_DIR/{data,saved_models}
    # (set it in backend/.env; defaults to this directory).
    volumes:
      - type: bind
        source: ${NGPSUITE_GMDB_DIR:-.}/data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NGPSUITE_GMDB_DIR:-.}/saved_models
        target: /app/saved_models
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 3m
      timeout: 10s
      retries: 3
      start_period: 90s

  # 2. Nginx reverse proxy service
  nginx:
    image: backend-nginx:latest
    build:
      context: ./nginx
    container_name: ngpsuite-proxy
    # Published on this machine only by default. Set NGPSUITE_BIND=0.0.0.0 in backend/.env to share on your LAN.
    ports:
      - "${NGPSUITE_BIND:-127.0.0.1}:443:443"
    volumes:
      - nginx_certs:/etc/ssl
    depends_on:
      api:
        condition: service_healthy
    # --- Add the following command to explicitly run the script and then nginx ---
    command: >
      sh -c "/docker-entrypoint.d/confirm-startup.sh && nginx -g 'daemon off;'"

# Define the named volume for persisting certificates
volumes:
  nginx_certs:
